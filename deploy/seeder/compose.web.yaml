# Versão web do Varanda no mesmo servidor do semeador: complementa
# compose.yaml. Liga a entrada WebSocket do semeador (só em 127.0.0.1) e põe
# um Caddy na frente, com TLS automático, servindo o app (deploy/seeder/www),
# repassando wss://<domínio>/seeder e https://<domínio>/account/* (o serviço de
# conta: vínculo com o Google e @nome). Só este arquivo precisa do Google: o
# compose.yaml sozinho (só o semeador) sobe sem ele.
#
# Da raiz do repositório, com deploy/seeder/.env preenchido (.env.example) e o
# app já publicado em deploy/seeder/www (deploy/seeder/build-web.sh):
#   docker compose -f deploy/seeder/compose.yaml -f deploy/seeder/compose.web.yaml up -d --build
# Passo a passo no README, seção "Pôr a versão web no ar".

services:
  seeder:
    environment:
      VARANDA_WS_PORT: "8789"
      VARANDA_WS_HOST: 127.0.0.1
      # O navegador manda Origin https://<domínio>; só ele é aceito.
      VARANDA_WS_ORIGIN: "https://${VARANDA_DOMAIN:?defina VARANDA_DOMAIN em deploy/seeder/.env}"

  web:
    image: caddy:2.11.6-alpine@sha256:d44355d3c2149dc580ce2cac735955d1c08d3d00882c30489c241aa51a5c10d9
    # Rede do host, como o semeador: as portas 80 e 443 do servidor e o
    # semeador em 127.0.0.1:8789.
    network_mode: host
    restart: unless-stopped
    environment:
      VARANDA_DOMAIN: "${VARANDA_DOMAIN:?defina VARANDA_DOMAIN em deploy/seeder/.env}"
      VARANDA_WS_PORT: "8789"
      # O serviço de conta, em 127.0.0.1 (handle /account/* no Caddyfile).
      VARANDA_ACCOUNT_PORT: "8790"
      # Chave pública da associação, servida em /varanda.json (Caddyfile).
      VARANDA_ASSOCIATION: "${VARANDA_ASSOCIATION:?defina VARANDA_ASSOCIATION em deploy/seeder/.env}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Preenchido por deploy/seeder/build-web.sh (nunca recriado, só o
      # conteúdo: o mount continua valendo depois de cada atualização).
      - ./www:/srv/web:ro
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      # Escutar nas portas 80 e 443.
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    # O Caddy não grava registro de acesso (não há diretiva log); os erros
    # que ele registra podem incluir o endereço do cliente. Mesma rotação do
    # semeador (política de registros no README, issue #38).
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  # Serviço de conta: liga o membro a uma conta Google e emite o certificado e
  # o @nome. Mesma imagem do semeador, construída só pelo serviço seeder
  # (compose.yaml), por isso sem build aqui. Sobe sem emissor configurado:
  # /account/health responde ok e as rotas de vínculo respondem 503
  # indisponivel até `account key` e `account cert add` (README) gravarem a
  # chave e o certificado do emissor no volume dele. Nenhum segredo do emissor
  # passa por aqui (nem variável, nem mount).
  account:
    image: varanda-seeder:local
    command: ["account", "--json"]
    # Rede do host, como o semeador; escuta só em 127.0.0.1, atrás do Caddy.
    network_mode: host
    restart: unless-stopped
    stop_signal: SIGTERM
    environment:
      VARANDA_ACCOUNT_PORT: "8790"
      VARANDA_ACCOUNT_HOST: 127.0.0.1
      VARANDA_DATA: /data
      VARANDA_ASSOCIATION: "${VARANDA_ASSOCIATION:?defina VARANDA_ASSOCIATION em deploy/seeder/.env}"
      VARANDA_PUBLIC_ORIGIN: "https://${VARANDA_DOMAIN:?defina VARANDA_DOMAIN em deploy/seeder/.env}"
      VARANDA_GOOGLE_CLIENT_ID: "${VARANDA_GOOGLE_CLIENT_ID:?defina VARANDA_GOOGLE_CLIENT_ID em deploy/seeder/.env}"
      VARANDA_GOOGLE_CLIENT_SECRET: "${VARANDA_GOOGLE_CLIENT_SECRET:?defina VARANDA_GOOGLE_CLIENT_SECRET em deploy/seeder/.env}"
    # Volume próprio: o diretório de contas e a chave do emissor nunca ficam
    # no volume do semeador.
    volumes:
      - account-data:/data
    # O HEALTHCHECK da imagem (Dockerfile) consulta VARANDA_HEALTH_PORT, que
    # não existe aqui; mesmos intervalos que ele.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8790/account/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Mesma rotação do semeador (política de registros no README, issue #38).
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

volumes:
  caddy-data:
  caddy-config:
  account-data:
