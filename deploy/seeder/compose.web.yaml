# Versão web do Varanda no mesmo servidor do semeador: complementa
# compose.yaml. Liga a entrada WebSocket do semeador (só em 127.0.0.1) e põe
# um Caddy na frente, com TLS automático, servindo o app (deploy/seeder/www),
# repassando wss://<domínio>/seeder e https://<domínio>/account/* (o serviço de
# conta: vínculo com o Google e @nome). Só este arquivo precisa do Google: o
# compose.yaml sozinho (só o semeador) sobe sem ele.
#
# Da raiz do repositório, com deploy/seeder/.env preenchido (.env.example) e o
# app já publicado em deploy/seeder/www (deploy/seeder/build-web.sh):
#   docker compose -f deploy/seeder/compose.yaml -f deploy/seeder/compose.web.yaml up -d --build
# Passo a passo no README, seção "Pôr a versão web no ar".

services:
  seeder:
    environment:
      VARANDA_WS_PORT: "8789"
      VARANDA_WS_HOST: 127.0.0.1
      # O navegador manda Origin https://<domínio>; só ele é aceito.
      VARANDA_WS_ORIGIN: "https://${VARANDA_DOMAIN:?defina VARANDA_DOMAIN em deploy/seeder/.env}"
      # Limites do semeador web, todos opcionais: vazio usa o padrão do
      # semeador (a CLI ignora valor vazio), então um .env sem estas linhas
      # continua subindo. Os valores vêm de apps/cli/scripts/load-ws.js e de
      # docs/verification.md; suba VARANDA_FRAME_MEMORY junto com
      # VARANDA_MAX_EXTERNAL.
      VARANDA_MAX_EXTERNAL: "${VARANDA_MAX_EXTERNAL:-}"
      VARANDA_MAX_SOCKETS: "${VARANDA_MAX_SOCKETS:-}"
      VARANDA_FRAME_MEMORY: "${VARANDA_FRAME_MEMORY:-}"
      VARANDA_MEDIA_MAX_IN_FLIGHT: "${VARANDA_MEDIA_MAX_IN_FLIGHT:-}"
      VARANDA_MEDIA_RATE: "${VARANDA_MEDIA_RATE:-}"
      VARANDA_MEDIA_BURST: "${VARANDA_MEDIA_BURST:-}"
      VARANDA_INDEX_MAX_IN_FLIGHT: "${VARANDA_INDEX_MAX_IN_FLIGHT:-}"
      VARANDA_INDEX_RATE: "${VARANDA_INDEX_RATE:-}"
      VARANDA_INDEX_BURST: "${VARANDA_INDEX_BURST:-}"
      # Segredo compartilhado com o serviço account para a rota local de
      # triagem por IA (leitura do post denunciado). Opcional: vazio deixa a
      # rota desligada, então um .env sem esta linha continua subindo.
      VARANDA_TRIAGE_TOKEN: "${VARANDA_TRIAGE_TOKEN:-}"
      # Segredo compartilhado com o serviço account para repassar os avisos
      # push (novo seguidor, resposta, curtida, repostagem). Opcional: vazio
      # deixa os avisos desligados, então um .env sem esta linha continua
      # subindo. A chave VAPID fica no volume account-data, nunca aqui.
      VARANDA_PUSH_TOKEN: "${VARANDA_PUSH_TOKEN:-}"
      # O serviço account (rede do host) escuta só em 127.0.0.1:8790
      # (VARANDA_ACCOUNT_PORT nele); o semeador o alcança ali para entregar
      # os avisos. Só loopback.
      VARANDA_ACCOUNT_HTTP: "${VARANDA_ACCOUNT_HTTP:-http://127.0.0.1:8790}"

  web:
    # O Caddy oficial (2.11.6, por digest) mais o módulo de limite por cliente
    # de /index/* e /media/*, construído por Dockerfile.caddy (tudo fixo por
    # digest e versão exata lá). O deploy.sh guarda a imagem anterior como
    # varanda-caddy:anterior e a volta se a saúde falhar.
    build:
      context: .
      dockerfile: Dockerfile.caddy
    image: varanda-caddy:local
    # Rede do host, como o semeador: as portas 80 e 443 do servidor e o
    # semeador em 127.0.0.1:8789.
    network_mode: host
    restart: unless-stopped
    environment:
      VARANDA_DOMAIN: "${VARANDA_DOMAIN:?defina VARANDA_DOMAIN em deploy/seeder/.env}"
      VARANDA_WS_PORT: "8789"
      # O serviço de conta, em 127.0.0.1 (handle /account/* no Caddyfile).
      VARANDA_ACCOUNT_PORT: "8790"
      # Chave pública da associação, servida em /varanda.json (Caddyfile).
      VARANDA_ASSOCIATION: "${VARANDA_ASSOCIATION:?defina VARANDA_ASSOCIATION em deploy/seeder/.env}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Preenchido por deploy/seeder/build-web.sh (nunca recriado, só o
      # conteúdo: o mount continua valendo depois de cada atualização).
      - ./www:/srv/web:ro
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      # Escutar nas portas 80 e 443.
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    # O Caddy não grava registro de acesso (não há log dentro do site) e o
    # registro "rate limit exceeded", que traz o endereço do cliente, é
    # excluído no Caddyfile; os erros que ele registra podem ainda incluir o
    # endereço do cliente. Mesma rotação do
    # semeador (política de registros no README, issue #38).
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  # Serviço de conta: liga o membro a uma conta Google e emite o certificado e
  # o @nome. Mesma imagem do semeador, construída só pelo serviço seeder
  # (compose.yaml), por isso sem build aqui. Sobe sem emissor configurado:
  # /account/health responde ok e as rotas de vínculo respondem 503
  # indisponivel até `account key` e `account cert add` (README) gravarem a
  # chave e o certificado do emissor no volume dele. Nenhum segredo do emissor
  # passa por aqui (nem variável, nem mount).
  account:
    image: varanda-seeder:local
    command: ["account", "--json"]
    # Rede do host, como o semeador; escuta só em 127.0.0.1, atrás do Caddy.
    network_mode: host
    restart: unless-stopped
    stop_signal: SIGTERM
    environment:
      VARANDA_ACCOUNT_PORT: "8790"
      VARANDA_ACCOUNT_HOST: 127.0.0.1
      VARANDA_DATA: /data
      VARANDA_ASSOCIATION: "${VARANDA_ASSOCIATION:?defina VARANDA_ASSOCIATION em deploy/seeder/.env}"
      VARANDA_PUBLIC_ORIGIN: "https://${VARANDA_DOMAIN:?defina VARANDA_DOMAIN em deploy/seeder/.env}"
      VARANDA_GOOGLE_CLIENT_ID: "${VARANDA_GOOGLE_CLIENT_ID:?defina VARANDA_GOOGLE_CLIENT_ID em deploy/seeder/.env}"
      VARANDA_GOOGLE_CLIENT_SECRET: "${VARANDA_GOOGLE_CLIENT_SECRET:?defina VARANDA_GOOGLE_CLIENT_SECRET em deploy/seeder/.env}"
      # E-mails Google dos moderadores (painel em /account/mod/). Opcional:
      # vazio mantém o painel desligado e o vínculo e as denúncias seguem
      # funcionando, então um .env sem esta linha continua subindo. Só o
      # serviço account a recebe (nem o semeador nem o web); moderation.json
      # fica em account-data.
      VARANDA_MODERATOR_EMAILS: "${VARANDA_MODERATOR_EMAILS:-}"
      # E-mails que veem a aba Estatísticas do painel (só contagens anônimas).
      # Opcional: vazio desliga a aba, a amostragem e o usage.json. Cada um
      # precisa estar também na lista de moderadores. Só o serviço account a
      # recebe (nem o semeador nem o web).
      VARANDA_STATS_EMAILS: "${VARANDA_STATS_EMAILS:-}"
      # Endpoint de saúde do semeador (compose.yaml o publica só em
      # 127.0.0.1:8788). Lido só com as estatísticas ligadas. Só loopback.
      VARANDA_SEEDER_HEALTH: "${VARANDA_SEEDER_HEALTH:-http://127.0.0.1:8788}"
      # Teto de membros vinculados. Vazio = sem teto; passando dele, um vínculo
      # NOVO recebe a resposta "lista de espera" e quem já é membro não muda.
      # O semeador tem o próprio limite de 4096 diários, então mantenha este
      # valor igual ou abaixo dele.
      VARANDA_MAX_MEMBERS: "${VARANDA_MAX_MEMBERS:-}"
      # Convites. Vazio = cadastro aberto. De 1 a 100 = só entra quem tem um
      # convite, e cada membro vinculado, operador incluído, ganha esse número
      # de convites por semana (de segunda a domingo, no horário de Brasília;
      # renova na segunda). Cada link vale 7 dias. Reinicie o account para
      # mudar. Com a rede vazia ninguém entra: a primeira pessoa precisa se
      # vincular com a variável vazia.
      VARANDA_INVITES_PER_WEEK: "${VARANDA_INVITES_PER_WEEK:-}"
      # Verificação de idade (Didit), opcional. Os dois vazios mantêm a
      # checagem desligada; os dois definidos a ligam para todo membro
      # hospedado, inclusive quem já está vinculado. Só o account recebe estas
      # variáveis. O age.json fica no volume account-data. O teto diário de
      # sessões vazio mantém o padrão do serviço.
      VARANDA_DIDIT_API_KEY: "${VARANDA_DIDIT_API_KEY:-}"
      VARANDA_DIDIT_WORKFLOW_ID: "${VARANDA_DIDIT_WORKFLOW_ID:-}"
      VARANDA_DIDIT_DAILY_LIMIT: "${VARANDA_DIDIT_DAILY_LIMIT:-}"
      # Conta de pagamentos (Hodle), opcional. A chave vazia mantém o recurso
      # desligado. O modo vazio é cadastro (só subconta e verificação); mudar
      # a imagem nunca liga movimento de dinheiro. Só o account recebe estas
      # variáveis. Os vazios mantêm os padrões do serviço.
      VARANDA_HODLE_API_KEY: "${VARANDA_HODLE_API_KEY:-}"
      VARANDA_HODLE_NETWORK: "${VARANDA_HODLE_NETWORK:-}"
      VARANDA_HODLE_MODE: "${VARANDA_HODLE_MODE:-}"
      VARANDA_HODLE_DAILY_LIMIT: "${VARANDA_HODLE_DAILY_LIMIT:-}"
      # Limites do serviço account. Vazios mantêm os padrões do serviço.
      VARANDA_ACCOUNT_MAX_CONNECTIONS: "${VARANDA_ACCOUNT_MAX_CONNECTIONS:-}"
      VARANDA_ACCOUNT_RATE: "${VARANDA_ACCOUNT_RATE:-}"
      VARANDA_ACCOUNT_BURST: "${VARANDA_ACCOUNT_BURST:-}"
      VARANDA_ACCOUNT_MAX_PENDING: "${VARANDA_ACCOUNT_MAX_PENDING:-}"
      # Triagem das denúncias por IA (similaridade semântica, MiniLM).
      # Opcional: vazio desliga, 'sombra' só registra sugestões no painel, '1'
      # deixa a IA decidir (bloqueios seguem pendentes até o `mod apply`).
      # Um .env sem estas linhas continua subindo com a triagem desligada.
      VARANDA_AI: "${VARANDA_AI:-}"
      # O semeador (rede do host) escuta HTTP/WS só em 127.0.0.1:8789
      # (VARANDA_WS_PORT acima); a conta, também na rede do host, o alcança
      # ali para ler o post denunciado. Só loopback.
      VARANDA_SEEDER_HTTP: "${VARANDA_SEEDER_HTTP:-http://127.0.0.1:8789}"
      # O mesmo segredo do serviço seeder, também sem a triagem por IA; vazio
      # desliga as leituras (denúncias de grupo só podem ser descartadas).
      VARANDA_TRIAGE_TOKEN: "${VARANDA_TRIAGE_TOKEN:-}"
      # O mesmo segredo do serviço seeder para os avisos push; vazio desliga
      # os avisos. A chave VAPID fica em push-vapid.json, em account-data.
      VARANDA_PUSH_TOKEN: "${VARANDA_PUSH_TOKEN:-}"
      # Pesos do modelo, dentro de account-data; baixados uma vez pelo
      # operador (scripts/fetch-ai-model.js), nunca em tempo de execução.
      VARANDA_AI_MODEL_DIR: "/data/ai-model"
    # Volume próprio: o diretório de contas e a chave do emissor nunca ficam
    # no volume do semeador.
    volumes:
      - account-data:/data
    # O HEALTHCHECK da imagem (Dockerfile) consulta VARANDA_HEALTH_PORT, que
    # não existe aqui; mesmos intervalos que ele.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8790/account/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Mesma rotação do semeador (política de registros no README, issue #38).
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

volumes:
  caddy-data:
  caddy-config:
  account-data:
