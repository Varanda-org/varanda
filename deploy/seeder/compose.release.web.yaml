# Versão publicada da web: aplicado depois de compose.web.yaml (e de
# compose.release.yaml), troca só as imagens. O web usa a imagem publicada em
# ghcr.io/varanda-org/varanda-web, a que o release.json do semeador fixa por
# digest; o account usa a mesma imagem do semeador. O build de compose.web.yaml
# fica, mas nunca é usado (o atualizador passa sempre --no-build), e as
# variáveis de ambiente continuam só em compose.web.yaml. Os binds relativos
# ./Caddyfile e ./www resolvem dentro do diretório da versão, que tem os dois.
# Quando a versão traz a imagem do Caddy (caddy.json), o update.sh passa ela
# em VARANDA_WEB_IMAGE e os binds fixos de compose.web.yaml.
#   docker compose -p varanda-seeder -f compose.yaml -f compose.web.yaml \
#     -f compose.release.yaml -f compose.release.web.yaml up -d --no-build
services:
  web:
    image: "${VARANDA_WEB_IMAGE:?defina VARANDA_WEB_IMAGE com a imagem publicada da web}"
  account:
    image: "${VARANDA_SEEDER_IMAGE:?defina VARANDA_SEEDER_IMAGE com a imagem publicada do semeador}"
