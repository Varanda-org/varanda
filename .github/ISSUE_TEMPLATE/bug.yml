name: Bug
description: Algo não funciona como deveria.
title: "[bug] "
labels: ["tipo:correção"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por reportar. Nunca cole chaves secretas nem o conteúdo do diretório de dados (association.json, seeder-key.json, store/).
        Se for uma vulnerabilidade, não abra issue pública. Siga o [SECURITY.md](https://github.com/Varanda-org/varanda/blob/main/SECURITY.md).
  - type: textarea
    id: o-que-aconteceu
    attributes:
      label: O que aconteceu
      description: Descreva o problema em poucas frases.
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Passos para reproduzir
      placeholder: |
        1. Rode `npm run demo`
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: O que você esperava
    validations:
      required: true
  - type: dropdown
    id: componente
    attributes:
      label: Componente
      options:
        - CLI (varanda)
        - Semeador (seed)
        - varanda-serve
        - App iOS
        - App Android
        - App web
        - Site varanda.app
        - Serviço de contas / painel de moderação
        - Núcleo/protocolo
        - Outro
    validations:
      required: true
  - type: input
    id: versao
    attributes:
      label: Versão (commit da main)
      placeholder: 89db2eb
  - type: textarea
    id: ambiente
    attributes:
      label: Ambiente
      description: Sistema operacional, versão do Node, aparelho ou simulador.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Confira se não há segredos antes de colar.
      render: shell
