# Sends a new iOS build to TestFlight through EAS on every push to main that
# touches the app (or a manual run on main). EAS builds the production profile
# of apps/app/eas.json on its own macOS machines and submits it to App Store
# Connect with the submit profile of the same name.
#
# A version bump ships it: when the version (app.json, store.config.json,
# Info.plist and project.pbxproj, which must match) has no App Store version
# yet, or one nobody submitted, scripts/ios-app-review.js waits for the build,
# then waits until App Store Connect has processed it, attaches it to that App
# Store version with "release automatically after approval", writes the
# release notes of store.config.json and submits it for review. Other merges
# stay on TestFlight, and the runner then only queues the build (--no-wait).
#
# Skipped until the repository variable VARANDA_IOS_RELEASE is true (GitHub compares it
# ignoring case).
#
# EAS raises the build number on every build (appVersionSource remote,
# autoIncrement).
#
# One-time user steps (see docs/development.md, "Envio para a App Store (EAS)"):
#   - In the Apple Developer account: App Groups with group.app.varanda on
#     app.varanda and app.varanda.share (this workflow never changes
#     capabilities, see EXPO_NO_CAPABILITY_SYNC below)
#   - From apps/app: eas credentials -p ios (distribution certificate,
#     provisioning profiles for the app and the VarandaShare extension, and
#     the App Store Connect API key for EAS Submit)
#   - An Expo access token for the varanda-org account
#   - An App Store Connect team API key with the App Manager role, for the
#     review submission
#   - Settings > Environments > app-store: deployment branches main only;
#     secrets EXPO_TOKEN, ASC_API_KEY_ID, ASC_API_ISSUER_ID and ASC_API_KEY_P8
#     (without the last three every build stays on TestFlight)
#   - Settings > Secrets and variables > Actions > Variables:
#     VARANDA_IOS_RELEASE = true (any other value pauses releases)
#
# apps/cli/test/ios-release.test.js pins the shape of this file.
name: ios-release

on:
  push:
    branches: [main]
    paths:
      - 'apps/app/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.easignore'
      - '.github/workflows/ios-release.yml'
  workflow_dispatch:

permissions:
  contents: read

# No workflow concurrency: a run that waits for approval would keep a newer
# run from starting at all. The testflight job has its own group, and the
# supersede job keeps only the newest run waiting for approval.
jobs:
  # Only the newest run asks for approval. A run that a newer one already
  # follows skips the build, and older runs still waiting for approval are
  # cancelled. The status is read again right before each cancel, so a run
  # that was approved meanwhile is left alone. The same job is in deploy.yml,
  # android-release.yml and site.yml (apps/cli/test/supersede.test.js).
  supersede:
    if: github.repository == 'Varanda-org/varanda' && github.ref == 'refs/heads/main' && vars.VARANDA_IOS_RELEASE == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    outputs:
      go: ${{ steps.runs.outputs.go }}
    steps:
      - id: runs
        name: Keep only the newest run waiting for approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="repos/$GITHUB_REPOSITORY/actions"
          wf=$(gh api "$api/runs/$GITHUB_RUN_ID" --jq .workflow_id)
          runs=$(gh api "$api/workflows/$wf/runs?branch=main&per_page=100")
          newer=$(jq --argjson n "$GITHUB_RUN_NUMBER" '[.workflow_runs[] | select(.run_number > $n)] | length' <<< "$runs")
          if [ "$newer" -gt 0 ]; then
            echo "::notice::uma execução mais nova deste fluxo já começou e pede a aprovação; esta termina sem implantar"
            echo "go=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          waiting=$(jq --argjson n "$GITHUB_RUN_NUMBER" '.workflow_runs[] | select(.run_number < $n and .status == "waiting") | .id' <<< "$runs")
          for id in $waiting; do
            [ "$(gh api "$api/runs/$id" --jq .status)" = waiting ] || continue
            if gh api -X POST "$api/runs/$id/cancel" > /dev/null; then
              echo "::notice::execução $id cancelada: esperava aprovação de um commit mais antigo"
            else
              echo "::warning::não foi possível cancelar a execução $id"
            fi
          done
          echo "go=true" >> "$GITHUB_OUTPUT"

  # Never cancelled once it runs: it may already have queued a build on EAS.
  testflight:
    needs: supersede
    if: github.repository == 'Varanda-org/varanda' && github.ref == 'refs/heads/main' && vars.VARANDA_IOS_RELEASE == 'true' && needs.supersede.outputs.go == 'true'
    runs-on: ubuntu-24.04
    # A release run waits for the EAS build and for App Store Connect.
    timeout-minutes: 180
    # actions: read is for the fresh step; contents: read for the checkout.
    permissions:
      actions: read
      contents: read
    environment:
      name: app-store
    concurrency:
      group: ios-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      # The supersede go was decided before the approval, and a re-run of an
      # old run reuses it. After the approval, the same "is there a newer run"
      # query runs again: a run that a newer one follows ends here without a
      # build. Not a comparison with the head of main, which the path filters
      # may have kept from running this workflow at all.
      - id: fresh
        name: Build only if no newer run of this workflow exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="repos/$GITHUB_REPOSITORY/actions"
          wf=$(gh api "$api/runs/$GITHUB_RUN_ID" --jq .workflow_id)
          runs=$(gh api "$api/workflows/$wf/runs?branch=main&per_page=100")
          newer=$(jq --argjson n "$GITHUB_RUN_NUMBER" '[.workflow_runs[] | select(.run_number > $n)] | length' <<< "$runs")
          if [ "$newer" -gt 0 ]; then
            echo "::notice::uma execução mais nova deste fluxo já começou; esta termina sem build"
            echo "go=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"
      - if: steps.fresh.outputs.go == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No npm cache in the job that holds EXPO_TOKEN: a cache written by
      # another run would feed this one. package-manager-cache: false keeps
      # setup-node from turning it on by itself (a packageManager field in
      # package.json would).
      - if: steps.fresh.outputs.go == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      # Before any install: the version check needs only the checkout, and the
      # App Store Connect key reaches no dependency.
      - if: steps.fresh.outputs.go == 'true'
        id: plan
        name: Check the version and whether it goes to App Review
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: node scripts/ios-app-review.js plan
      # eas reads app.json and its config plugins from node_modules.
      # --ignore-scripts: no dependency install script runs in CI (supply chain).
      - if: steps.fresh.outputs.go == 'true'
        run: npm ci --ignore-scripts
      # The eas-cli the production profile was first built and submitted with,
      # with every dependency fixed by .github/eas-cli/package-lock.json.
      - if: steps.fresh.outputs.go == 'true'
        working-directory: .github/eas-cli
        run: npm ci --ignore-scripts
      - if: steps.fresh.outputs.go == 'true'
        name: Build and submit to TestFlight
        working-directory: apps/app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          RELEASE: ${{ steps.plan.outputs.release }}
          DISABLE_EAS_ANALYTICS: '1'
          EXPO_NO_TELEMETRY: '1'
          # The build never turns capabilities on or off in the Apple account:
          # a new one is enabled by hand and reaches the profiles through
          # eas credentials. Apple refused EAS's own App Groups request for the
          # share extension (2026-11-12).
          EXPO_NO_CAPABILITY_SYNC: '1'
        # Without a release only the queueing runs here (--no-wait). With one,
        # eas waits for the build and its submission and fails if either does.
        run: |
          set -euo pipefail
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN ausente: veja docs/development.md, seção Envio para a App Store (EAS)"
            exit 1
          fi
          wait_flag=--no-wait
          if [ "$RELEASE" = true ]; then wait_flag=; fi
          "$GITHUB_WORKSPACE"/.github/eas-cli/node_modules/.bin/eas build --platform ios --profile production --auto-submit --non-interactive --json $wait_flag > "$RUNNER_TEMP/eas-build.json"
      - if: steps.fresh.outputs.go == 'true' && steps.plan.outputs.release == 'true'
        name: Send the version to App Review
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: node scripts/ios-app-review.js submit "$RUNNER_TEMP/eas-build.json"
