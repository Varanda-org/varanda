# Runs the project's checks on every pull request and on pushes to main.
#
# Installs from the lockfile, then runs the same commands a contributor runs
# locally: lint, the test suites of every workspace, and the CLI demo. No
# secrets and no network services beyond the npm registry.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # --ignore-scripts: no dependency install script runs in CI (supply
      # chain). onnxruntime-node's would only fetch CUDA artifacts; its CPU
      # binary, sharp's and esbuild's ship in their packages.
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test
      - run: npm run demo
