# Runs the project's checks on every pull request and on pushes to main.
#
# Installs from the lockfile, then runs the same commands a contributor runs
# locally: lint, the test suites, and the CLI demo. No secrets and no network
# services beyond the npm registry.
#
# A push to main runs every workspace. A pull request runs only the
# workspaces its change can reach (scripts/affected.js, the same selection
# as a local `npm test -- --affected=<ref>`), so a change that stays in the
# app does not queue the core, cli and web-member shards on a runner pool of
# about twenty jobs. The `affected` job computes it once from the base of the
# test merge commit (HEAD^1). When it cannot tell (not a merge commit, any
# error) it selects everything or fails, never less.
#
# The checks are split into eight parallel worker jobs per Node version (the
# slow core and cli suites in two shards each, web-member in three, and
# `others` for everything else plus lint and demo), then one gate job per
# Node version. The main ruleset requires checks named exactly `test (20)`
# and `test (24)`: only the gates carry those names. The shards of a
# workspace the change does not reach are skipped by their `if:`, and the
# gate accepts a skip only where `affected` asked for it.
#
# There is deliberately no matrix: a matrix leg cancelled because no runner
# picked it up has been reported to leave the matrix job's needs result at
# success, and a required check must never go green on a leg that did not
# run. Each worker is its own job, and each gate checks every worker's own
# result.
#
# The step list is written once (the &test-steps anchor on the first worker)
# and reused by alias; per-job differences live only in the job env.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# VARANDA_TEST_CONCURRENCY is pinned to 1 in every worker: the jobs are the
# CI parallelism, and some asserts are load sensitive on 4-vCPU runners, so
# each file runs alone, as the timing asserts were calibrated for.
#
# `others` runs root `npm test` with a skip list of the workspaces the other
# seven workers cover, so a workspace added later runs there without editing
# this file. On a pull request it passes --affected, so it also leaves out
# the workspaces the change does not reach; lint and demo always run.
jobs:
  # One line per output: `ref` is the --affected reference ('' on a push or
  # when HEAD is not a merge commit, which runs everything), and core, cli
  # and web_member are exactly 'true' or 'false'. The gates fail on any other
  # value, so an empty output never passes as a skip.
  affected:
    name: affected
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ref: ${{ steps.pick.outputs.ref }}
      core: ${{ steps.pick.outputs.core }}
      cli: ${{ steps.pick.outputs.cli }}
      web_member: ${{ steps.pick.outputs.web_member }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
        run: |
          ref=''
          if [ "$EVENT" = pull_request ] && git rev-parse --verify --quiet 'HEAD^2' > /dev/null; then ref='HEAD^1'; fi
          if [ -n "$ref" ]; then list="$(node scripts/run-tests.js --workspaces --list --affected="$ref")"; else list="$(node scripts/run-tests.js --workspaces --list)"; fi
          echo "ref=$ref"
          printf '%s\n' "$list"
          has() { if grep -qxF -- "$1" <<< "$list"; then echo true; else echo false; fi; }
          {
            echo "ref=$ref"
            echo "core=$(has packages/core)"
            echo "cli=$(has apps/cli)"
            echo "web_member=$(has packages/web-member)"
          } >> "$GITHUB_OUTPUT"

  core-1-20:
    name: core 1/2 (20)
    needs: affected
    if: needs.affected.outputs.core == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NODE: '20'
      SUITE: core-1
      WORKSPACE: packages/core
      VARANDA_TEST_SHARD: 1/2
      VARANDA_TEST_CONCURRENCY: '1'
    steps: &test-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE }}
          cache: npm
      # --ignore-scripts: no dependency install script runs in CI (supply
      # chain). onnxruntime-node's would only fetch CUDA artifacts; its CPU
      # binary, sharp's and esbuild's ship in their packages.
      - run: npm ci --ignore-scripts
      - if: env.SUITE == 'others'
        run: npm run lint
      - run: if [ -n "$WORKSPACE" ]; then npm test -w "$WORKSPACE"; elif [ -n "$AFFECTED_REF" ]; then npm test -- --affected="$AFFECTED_REF"; else npm test; fi
      - if: env.SUITE == 'others'
        run: npm run demo

  core-2-20:
    name: core 2/2 (20)
    needs: affected
    if: needs.affected.outputs.core == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NODE: '20'
      SUITE: core-2
      WORKSPACE: packages/core
      VARANDA_TEST_SHARD: 2/2
      VARANDA_TEST_CONCURRENCY: '1'
    steps: *test-steps

  cli-1-20:
    name: cli 1/2 (20)
    needs: affected
    if: needs.affected.outputs.cli == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NODE: '20'
      SUITE: cli-1
      WORKSPACE: apps/cli
      VARANDA_TEST_SHARD: 1/2
      VARANDA_TEST_CONCURRENCY: '1'
    steps: *test-steps

  cli-2-20:
    name: cli 2/2 (20)
    needs: affected
    if: needs.affected.outputs.cli == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NODE: '20'
      SUITE: cli-2
      WORKSPACE: apps/cli
      VARANDA_TEST_SHARD: 2/2
      VARANDA_TEST_CONCURRENCY: '1'
    steps: *test-steps

  web-member-1-20:
    name: web-member 1/3 (20)
    needs: affected
    if: needs.affected.outputs.web_member == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NODE: '20'
      SUITE: web-member-1
      WORKSPACE: packages/web-member
      VARANDA_TEST_SHARD: 1/3
      VARANDA_TEST_CONCURRENCY: '1'
    steps: *test-steps

  web-member-2-20:
    name: web-member 2/3 (20)
    needs: affected
    if: needs.affected.outputs.web_member == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NODE: '20'
      SUITE: web-member-2
      WORKSPACE: packages/web-member
      VARANDA_TEST_SHARD: 2/3
      VARANDA_TEST_CONCURRENCY: '1'
    steps: *test-steps

  web-member-3-20:
    name: web-member 3/3 (20)
    needs: affected
    if: needs.affected.outputs.web_member == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NODE: '20'
      SUITE: web-member-3
      WORKSPACE: packages/web-member
      VARANDA_TEST_SHARD: 3/3
      VARANDA_TEST_CONCURRENCY: '1'
    steps: *test-steps

  others-20:
    name: others (20)
    needs: affected
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NODE: '20'
      SUITE: others
      VARANDA_TEST_SKIP_WORKSPACES: packages/core,apps/cli,packages/web-member
      VARANDA_TEST_CONCURRENCY: '1'
      AFFECTED_REF: ${{ needs.affected.outputs.ref }}
    steps: *test-steps

  core-1-24:
    name: core 1/2 (24)
    needs: affected
    if: needs.affected.outputs.core == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NODE: '24'
      SUITE: core-1
      WORKSPACE: packages/core
      VARANDA_TEST_SHARD: 1/2
      VARANDA_TEST_CONCURRENCY: '1'
    steps: *test-steps

  core-2-24:
    name: core 2/2 (24)
    needs: affected
    if: needs.affected.outputs.core == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NODE: '24'
      SUITE: core-2
      WORKSPACE: packages/core
      VARANDA_TEST_SHARD: 2/2
      VARANDA_TEST_CONCURRENCY: '1'
    steps: *test-steps

  cli-1-24:
    name: cli 1/2 (24)
    needs: affected
    if: needs.affected.outputs.cli == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NODE: '24'
      SUITE: cli-1
      WORKSPACE: apps/cli
      VARANDA_TEST_SHARD: 1/2
      VARANDA_TEST_CONCURRENCY: '1'
    steps: *test-steps

  cli-2-24:
    name: cli 2/2 (24)
    needs: affected
    if: needs.affected.outputs.cli == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NODE: '24'
      SUITE: cli-2
      WORKSPACE: apps/cli
      VARANDA_TEST_SHARD: 2/2
      VARANDA_TEST_CONCURRENCY: '1'
    steps: *test-steps

  web-member-1-24:
    name: web-member 1/3 (24)
    needs: affected
    if: needs.affected.outputs.web_member == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NODE: '24'
      SUITE: web-member-1
      WORKSPACE: packages/web-member
      VARANDA_TEST_SHARD: 1/3
      VARANDA_TEST_CONCURRENCY: '1'
    steps: *test-steps

  web-member-2-24:
    name: web-member 2/3 (24)
    needs: affected
    if: needs.affected.outputs.web_member == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NODE: '24'
      SUITE: web-member-2
      WORKSPACE: packages/web-member
      VARANDA_TEST_SHARD: 2/3
      VARANDA_TEST_CONCURRENCY: '1'
    steps: *test-steps

  web-member-3-24:
    name: web-member 3/3 (24)
    needs: affected
    if: needs.affected.outputs.web_member == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NODE: '24'
      SUITE: web-member-3
      WORKSPACE: packages/web-member
      VARANDA_TEST_SHARD: 3/3
      VARANDA_TEST_CONCURRENCY: '1'
    steps: *test-steps

  others-24:
    name: others (24)
    needs: affected
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NODE: '24'
      SUITE: others
      VARANDA_TEST_SKIP_WORKSPACES: packages/core,apps/cli,packages/web-member
      VARANDA_TEST_CONCURRENCY: '1'
      AFFECTED_REF: ${{ needs.affected.outputs.ref }}
    steps: *test-steps

  # The gates carry the required check names. `if: always()` and never
  # `!cancelled()` or `success()`: a skipped required check counts as passing
  # on GitHub, so the gate must run and fail closed when any worker failed or
  # was cancelled, and when a worker was skipped that `affected` did not skip.
  # `affected` and `others` must succeed. Each suite's shards must all pass
  # when its output is 'true' and all be skipped when it is 'false'; any other
  # output fails. The count checks stop a vacuous pass if needs or a suite's
  # results were ever edited down or emptied.
  test-20:
    name: test (20)
    if: always()
    needs: [affected, core-1-20, core-2-20, cli-1-20, cli-2-20, web-member-1-20, web-member-2-20, web-member-3-20, others-20]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          AFFECTED: ${{ needs.affected.result }}
          OTHERS: ${{ needs.others-20.result }}
          CORE_RUN: ${{ needs.affected.outputs.core }}
          CORE: ${{ needs.core-1-20.result }} ${{ needs.core-2-20.result }}
          CLI_RUN: ${{ needs.affected.outputs.cli }}
          CLI: ${{ needs.cli-1-20.result }} ${{ needs.cli-2-20.result }}
          WEB_MEMBER_RUN: ${{ needs.affected.outputs.web_member }}
          WEB_MEMBER: ${{ needs.web-member-1-20.result }} ${{ needs.web-member-2-20.result }} ${{ needs.web-member-3-20.result }}
        run: |
          echo "$RESULTS"
          echo "core=$CORE_RUN cli=$CLI_RUN web_member=$WEB_MEMBER_RUN"
          set -- $RESULTS
          [ "$#" -eq 9 ] || exit 1
          [ "$AFFECTED" = success ] || exit 1
          [ "$OTHERS" = success ] || exit 1
          suite() {
            run="$1"; want="$2"; shift 2
            [ "$#" -eq "$want" ] || exit 1
            for r in "$@"; do
              case "$run" in
                true) [ "$r" = success ] || exit 1 ;;
                false) [ "$r" = skipped ] || exit 1 ;;
                *) exit 1 ;;
              esac
            done
          }
          suite "$CORE_RUN" 2 $CORE
          suite "$CLI_RUN" 2 $CLI
          suite "$WEB_MEMBER_RUN" 3 $WEB_MEMBER

  test-24:
    name: test (24)
    if: always()
    needs: [affected, core-1-24, core-2-24, cli-1-24, cli-2-24, web-member-1-24, web-member-2-24, web-member-3-24, others-24]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          AFFECTED: ${{ needs.affected.result }}
          OTHERS: ${{ needs.others-24.result }}
          CORE_RUN: ${{ needs.affected.outputs.core }}
          CORE: ${{ needs.core-1-24.result }} ${{ needs.core-2-24.result }}
          CLI_RUN: ${{ needs.affected.outputs.cli }}
          CLI: ${{ needs.cli-1-24.result }} ${{ needs.cli-2-24.result }}
          WEB_MEMBER_RUN: ${{ needs.affected.outputs.web_member }}
          WEB_MEMBER: ${{ needs.web-member-1-24.result }} ${{ needs.web-member-2-24.result }} ${{ needs.web-member-3-24.result }}
        run: |
          echo "$RESULTS"
          echo "core=$CORE_RUN cli=$CLI_RUN web_member=$WEB_MEMBER_RUN"
          set -- $RESULTS
          [ "$#" -eq 9 ] || exit 1
          [ "$AFFECTED" = success ] || exit 1
          [ "$OTHERS" = success ] || exit 1
          suite() {
            run="$1"; want="$2"; shift 2
            [ "$#" -eq "$want" ] || exit 1
            for r in "$@"; do
              case "$run" in
                true) [ "$r" = success ] || exit 1 ;;
                false) [ "$r" = skipped ] || exit 1 ;;
                *) exit 1 ;;
              esac
            done
          }
          suite "$CORE_RUN" 2 $CORE
          suite "$CLI_RUN" 2 $CLI
          suite "$WEB_MEMBER_RUN" 3 $WEB_MEMBER
