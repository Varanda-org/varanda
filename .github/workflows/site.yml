# Deploys the static varanda.app site to GitHub Pages.
#
# On every push to main (or a manual run) it uploads only apps/site/public as
# the Pages artifact and deploys it. No npm, no build step, no secrets.
#
# One-time user steps in the repo settings (see docs/site.md):
#   - Settings > Pages > Source: "GitHub Actions"
#   - Settings > Pages > Custom domain: varanda.app
name: site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# No workflow concurrency: a run that waits for approval would keep a newer
# run from starting at all. The deploy job has its own group, and the
# supersede job keeps only the newest run waiting for approval.
jobs:
  build:
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/site/public

  # Only the newest run asks for approval. A run that a newer one already
  # follows skips the deploy, so an older page never replaces a newer one, and
  # older runs still waiting for approval are cancelled. The status is read
  # again right before each cancel, so a run that was approved meanwhile is
  # left alone. The same job is in deploy.yml and ios-release.yml
  # (apps/cli/test/supersede.test.js).
  supersede:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    outputs:
      go: ${{ steps.runs.outputs.go }}
    steps:
      - id: runs
        name: Keep only the newest run waiting for approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="repos/$GITHUB_REPOSITORY/actions"
          wf=$(gh api "$api/runs/$GITHUB_RUN_ID" --jq .workflow_id)
          runs=$(gh api "$api/workflows/$wf/runs?branch=main&per_page=100")
          newer=$(jq --argjson n "$GITHUB_RUN_NUMBER" '[.workflow_runs[] | select(.run_number > $n)] | length' <<< "$runs")
          if [ "$newer" -gt 0 ]; then
            echo "::notice::uma execução mais nova deste fluxo já começou e pede a aprovação; esta termina sem implantar"
            echo "go=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          waiting=$(jq --argjson n "$GITHUB_RUN_NUMBER" '.workflow_runs[] | select(.run_number < $n and .status == "waiting") | .id' <<< "$runs")
          for id in $waiting; do
            [ "$(gh api "$api/runs/$id" --jq .status)" = waiting ] || continue
            if gh api -X POST "$api/runs/$id/cancel" > /dev/null; then
              echo "::notice::execução $id cancelada: esperava aprovação de um commit mais antigo"
            else
              echo "::warning::não foi possível cancelar a execução $id"
            fi
          done
          echo "go=true" >> "$GITHUB_OUTPUT"

  # One group: a deploy that started finishes before the next one.
  deploy:
    needs: [build, supersede]
    if: github.ref == 'refs/heads/main' && needs.supersede.outputs.go == 'true'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
