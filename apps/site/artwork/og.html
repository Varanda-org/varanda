<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Varanda: imagem de compartilhamento</title>
<style>
  html, body { margin: 0; padding: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; }
  .cartao {
    position: relative;
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: linear-gradient(180deg, #f7b267 0, #f09a5f 190px, #e8805a 370px, #8a4e7a 470px, #2b2a4a 100%);
  }
  .sol {
    position: absolute;
    left: 255px;
    top: 70px;
    width: 640px;
    height: 640px;
    border-radius: 50%;
    background: radial-gradient(circle, #ffe2a8 0, #ffc77c 32%, rgba(247, 178, 103, 0.55) 48%, rgba(247, 178, 103, 0) 70%);
  }
  .onda {
    position: absolute;
    left: 0;
    right: 0;
    background-image: url("../public/assets/mar-largo.svg");
    background-repeat: repeat-x;
  }
  .onda--longe {
    bottom: 82px;
    height: 45px;
    background-image: linear-gradient(180deg, rgba(138, 78, 122, 0.34), rgba(232, 128, 90, 0.1)), url("../public/assets/mar-largo.svg");
    background-size: 120px 45px;
  }
  .onda--perto {
    bottom: 0;
    height: 90px;
    background-size: 240px 90px;
    box-shadow: 0 -1px 0 rgba(31, 42, 36, 0.25);
  }
  .logo {
    position: absolute;
    left: 70px;
    top: 24px;
    height: 500px;
    width: 553px;
    filter: drop-shadow(0 0 2px rgba(255, 244, 224, 0.9)) drop-shadow(0 0 14px rgba(255, 196, 140, 0.45));
  }
  .telefone {
    position: absolute;
    left: 815px;
    top: 52px;
    width: 250px;
    padding: 9px;
    box-sizing: border-box;
    border-radius: 44px;
    background: linear-gradient(160deg, #3a3f45, #0f1214 55%, #24282c);
    box-shadow:
      0 0 0 1.5px rgba(255, 255, 255, 0.08) inset,
      0 30px 60px -20px rgba(20, 14, 40, 0.55),
      0 12px 24px -12px rgba(20, 14, 40, 0.4);
    transform: rotate(4deg);
  }
  /* O esqueleto do feed novo, sem letra nenhuma (as fontes do sistema não
     podem ser gravadas na imagem): bolinhas de avatar, barras no lugar do
     texto, as abas e o botão verde de publicar. 1 unidade = 1 pt de 402. */
  .tela {
    position: relative;
    width: 232px;
    height: 504.4px;
    overflow: hidden;
    border-radius: 35px;
    background: #fbf8f3;
    --pt: 0.577px;
  }
  .tela__barra {
    display: flex;
    align-items: center;
    gap: calc(10 * var(--pt));
    height: calc(56 * var(--pt));
    margin-top: calc(50 * var(--pt));
    padding: 0 calc(16 * var(--pt));
    border-bottom: calc(1 * var(--pt)) solid rgba(31, 42, 36, 0.1);
  }
  .tela__marca { width: calc(32 * var(--pt)); height: calc(32 * var(--pt)); background: url("../public/assets/cadeira.svg") center / contain no-repeat; }
  .tela__titulo { width: calc(64 * var(--pt)); height: calc(14 * var(--pt)); border-radius: 999px; background: #1f2a24; }
  .tela__chip { margin-left: auto; width: calc(96 * var(--pt)); height: calc(22 * var(--pt)); border-radius: 999px; background: rgba(29, 107, 79, 0.14); }
  .ilha { position: absolute; left: 50%; top: calc(11 * var(--pt)); width: calc(126 * var(--pt)); height: calc(37 * var(--pt)); margin-left: calc(-63 * var(--pt)); border-radius: 999px; background: #0b0c0d; }
  .post { display: flex; gap: calc(12 * var(--pt)); padding: calc(14 * var(--pt)) calc(16 * var(--pt)); border-bottom: calc(1 * var(--pt)) solid rgba(31, 42, 36, 0.1); }
  .avatar { flex: none; width: calc(44 * var(--pt)); height: calc(44 * var(--pt)); border-radius: 50%; }
  .post > div:last-child { flex: 1; min-width: 0; }
  .barra { height: calc(11 * var(--pt)); border-radius: 999px; background: rgba(31, 42, 36, 0.14); margin-bottom: calc(8 * var(--pt)); }
  .barra--nome { width: 42%; height: calc(13 * var(--pt)); background: rgba(31, 42, 36, 0.55); margin-bottom: calc(10 * var(--pt)); }
  .barra--curta { width: 62%; }
  .balao { width: calc(18 * var(--pt)); height: calc(18 * var(--pt)); margin-top: calc(4 * var(--pt)); border: calc(1.8 * var(--pt)) solid rgba(74, 85, 78, 0.8); border-radius: 50% 50% 50% 10%; }
  .fab { position: absolute; right: calc(20 * var(--pt)); bottom: calc(100 * var(--pt)); width: calc(56 * var(--pt)); height: calc(56 * var(--pt)); border-radius: 50%; background: #1d6b4f; box-shadow: 0 calc(6 * var(--pt)) calc(16 * var(--pt)) rgba(29, 107, 79, 0.35); }
  .fab::before { content: ""; position: absolute; left: 50%; top: 50%; width: calc(24 * var(--pt)); height: calc(4 * var(--pt)); margin: calc(-2 * var(--pt)) 0 0 calc(-12 * var(--pt)); border-radius: 999px; background: #fff; transform: rotate(-45deg); }
  .abas { position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-around; align-items: flex-start; height: calc(83 * var(--pt)); padding: calc(10 * var(--pt)) calc(24 * var(--pt)) 0; border-top: calc(1 * var(--pt)) solid rgba(31, 42, 36, 0.1); background: rgba(251, 248, 243, 0.94); }
  .aba { width: calc(26 * var(--pt)); height: calc(26 * var(--pt)); border-radius: calc(6 * var(--pt)); border: calc(2.4 * var(--pt)) solid #4a554e; }
  .aba--ativa { border-color: #1d6b4f; background: rgba(29, 107, 79, 0.18); }
  .aba--redonda { border-radius: 50%; }
  .home { position: absolute; left: 50%; bottom: calc(8 * var(--pt)); width: calc(134 * var(--pt)); height: calc(5 * var(--pt)); margin-left: calc(-67 * var(--pt)); border-radius: 999px; background: #1f2a24; }
  .telefone::after {
    content: "";
    position: absolute;
    inset: 9px;
    border-radius: 35px;
    background: linear-gradient(115deg, rgba(255, 255, 255, 0.22) 0, rgba(255, 255, 255, 0.05) 28%, rgba(255, 255, 255, 0) 42%);
  }
</style>
</head>
<body>
<div class="cartao">
  <div class="sol"></div>
  <div class="onda onda--longe"></div>
  <div class="onda onda--perto"></div>
  <img class="logo" src="logo/lockup.svg" alt="" width="520" height="470">
  <div class="telefone">
    <div class="tela">
      <div class="ilha"></div>
      <div class="tela__barra"><div class="tela__marca"></div><div class="tela__titulo"></div><div class="tela__chip"></div></div>
      <div class="post"><div class="avatar" style="background:#c23528"></div><div><div class="barra barra--nome"></div><div class="barra"></div><div class="barra barra--curta"></div><div class="balao"></div></div></div>
      <div class="post"><div class="avatar" style="background:#f2b705"></div><div><div class="barra barra--nome"></div><div class="barra"></div><div class="balao"></div></div></div>
      <div class="post"><div class="avatar" style="background:#2576b0"></div><div><div class="barra barra--nome"></div><div class="barra"></div><div class="barra barra--curta"></div><div class="balao"></div></div></div>
      <div class="post"><div class="avatar" style="background:#1d6b4f"></div><div><div class="barra barra--nome"></div><div class="barra"></div><div class="barra"></div><div class="barra barra--curta"></div><div class="balao"></div></div></div>
      <div class="post"><div class="avatar" style="background:#e8805a"></div><div><div class="barra barra--nome"></div><div class="barra"></div><div class="balao"></div></div></div>
      <div class="post"><div class="avatar" style="background:#2576b0"></div><div><div class="barra barra--nome"></div><div class="barra"></div><div class="barra barra--curta"></div><div class="balao"></div></div></div>
      <div class="post"><div class="avatar" style="background:#c23528"></div><div><div class="barra barra--nome"></div><div class="barra"></div><div class="balao"></div></div></div>
      <div class="fab"></div>
      <div class="abas"><div class="aba aba--ativa"></div><div class="aba aba--redonda"></div><div class="aba aba--redonda"></div></div>
      <div class="home"></div>
    </div>
  </div>
</div>
</body>
</html>
