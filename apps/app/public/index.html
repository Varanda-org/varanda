    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->

      /* These styles make the body full-height */
      html,

        background-color: #fbf8f3;
      }
      /* These styles disable body scrolling if you are using <ScrollView>; html
         too, so the layout viewport cannot pan after a screen push */

      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;

         app's lists refresh themselves) */

      }

      #varanda-pre-splash .scene .chair { left: calc(50% - 58px); top: 146px; width: 116px; height: 116px; }

      #varanda-pre-splash .arvore { left: max(calc(50% - 208px), 0px); top: 46px; width: 96px; height: 208px; }
      /* a bird at rest sits `phase` of the way across, where its drift starts */
      #varanda-pre-splash .ave { position: absolute; left: 0; width: 100%; }
      #varanda-pre-splash .ave svg { left: 0; top: 0; height: 100%; overflow: visible; }
      #varanda-pre-splash .a1 { top: 22px; height: 9px; transform: translateX(calc(12% - 15.84px)); } #varanda-pre-splash .a1 svg { width: 18px; }
      #varanda-pre-splash .a2 { top: 38px; height: 7px; transform: translateX(calc(48% - 7.28px)); } #varanda-pre-splash .a2 svg { width: 14px; }
      #varanda-pre-splash .a3 { top: 52px; height: 8px; transform: translateX(calc(80% - 3.2px)); } #varanda-pre-splash .a3 svg { width: 16px; }
      #varanda-pre-splash .borboleta { position: absolute; left: calc(50% + 112px); top: 185px; width: 28px; height: 23px; }
      #varanda-pre-splash .borboleta svg { left: 0; top: 0; width: 100%; height: 100%; overflow: visible; }
      #varanda-pre-splash .ground { position: absolute; left: 0; right: 0; top: 254px; bottom: 0; }
      #varanda-pre-splash .strip { left: 0; will-change: transform; }
      #varanda-pre-splash .far { top: 0px; width: calc(100% + 128px); height: 48px; }
      #varanda-pre-splash .near { top: 48px; width: calc(100% + 192px); height: 96px; }
      #varanda-pre-splash .kerb, #varanda-pre-splash .rua { position: absolute; left: 0; right: 0; }
      #varanda-pre-splash .kerb { top: 144px; height: 6px; background: var(--vps-meioFio); }
      /* the scene sits above the inset; the rua runs on under it at the smallest k too */
      #varanda-pre-splash .rua { top: 150px; height: calc(36px + 3 * env(safe-area-inset-bottom)); background: var(--vps-asfalto); }

      #varanda-pre-splash .f-tinta { fill: var(--vps-tinta); }
      #varanda-pre-splash .f-parede { fill: var(--vps-parede); }
      #varanda-pre-splash .f-telha { fill: var(--vps-telha); }
      #varanda-pre-splash .f-beiral { fill: var(--vps-beiral); }
      #varanda-pre-splash .f-madeira { fill: var(--vps-madeira); }
      #varanda-pre-splash .f-planta { fill: var(--vps-planta); }
      #varanda-pre-splash .f-sol { fill: var(--vps-sol); }
      #varanda-pre-splash .f-tronco { fill: var(--vps-tronco); }
      #varanda-pre-splash .f-copa { fill: var(--vps-copa); }
      #varanda-pre-splash .s-tinta { stroke: var(--vps-tinta); }
      #varanda-pre-splash .s-junta { stroke: var(--vps-junta); }
      #varanda-pre-splash .s-beiral { stroke: var(--vps-beiral); }
      #varanda-pre-splash .s-ave { stroke: var(--vps-ave); }
      @media (max-height: 599.98px) { #varanda-pre-splash { padding-bottom: 330px; } #varanda-pre-splash .scene { transform: scale(0.75); width: calc(100% / 0.75); } }
      @media (max-height: 439.98px) { #varanda-pre-splash { padding-bottom: 220px; } #varanda-pre-splash .scene { transform: scale(0.5); width: calc(100% / 0.5); } }
      @media (max-height: 329.98px) { #varanda-pre-splash { padding-bottom: 165px; } #varanda-pre-splash .scene { transform: scale(0.375); width: calc(100% / 0.375); } }
      @media (prefers-color-scheme: dark) {
        html,
        body,
        #varanda-pre-splash { background: #101010; }
        #varanda-pre-splash { --vps-pedra: #bdb6a8; --vps-tinta: #18211c; --vps-junta: #6d695e; --vps-parede: #f3ede2; --vps-telha: #b56446; --vps-beiral: #822c22; --vps-madeira: #906e5a; --vps-planta: #17533e; --vps-meioFio: #a7a197; --vps-asfalto: #303532; --vps-letra: #fbf8f3; --vps-ceuTopo: #101010; --vps-ceuOuro: #131a2a; --vps-ceuLaranja: #18233a; --vps-ceuCoral: #1e2c4a; --vps-ceuAmeixa: #233456; --vps-ceuNoite: #2a3d62; --vps-solNucleo: #f4f1e8; --vps-solMeio: #d6dbe4; --vps-solHalo: #9fb0cc; --vps-ave: #c3cad6; --vps-sol: #bd8f04; --vps-tronco: #785340; --vps-copa: #144936; --vps-sun0: #f4f1e8; --vps-sun1: #d6dbe4; --vps-sun2: rgba(159, 176, 204, 0.55); --vps-sun3: rgba(159, 176, 204, 0); }

        #varanda-pre-splash .a1 { animation: vps-ave1 34000ms linear -4080ms infinite; }

        #varanda-pre-splash .a1 svg { animation: vps-bob1 1700ms ease-in-out -1700ms infinite alternate; }

        #varanda-pre-splash .a2 { animation: vps-ave2 29000ms linear -13920ms infinite; }

        #varanda-pre-splash .a2 svg { animation: vps-bob2 1813ms ease-in-out -1813ms infinite alternate; }

        #varanda-pre-splash .a3 { animation: vps-ave3 38000ms linear -30400ms infinite; }

        #varanda-pre-splash .a3 svg { animation: vps-bob3 1583ms ease-in-out -1583ms infinite alternate; }

        #varanda-pre-splash .borboleta { animation: vps-borboleta 6000ms linear infinite; }

        #varanda-pre-splash .bar span { transition: width 400ms ease-out; }
        @keyframes vps-fade { from { opacity: 0; } to { opacity: 1; } }
