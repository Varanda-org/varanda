    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        /* The app's background, so the page matches the app before the first paint and behind modals */
        background-color: #fbf8f3;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* Stop the browser's own pull-to-refresh and the document bounce (the
         app's lists refresh themselves) */
      html,
      body {
        overscroll-behavior-y: none;
      }
      [data-pull=y] {
        overscroll-behavior-y: contain;
      }
      body {
        -webkit-tap-highlight-color: transparent;
      }
    </style>
    <style id="varanda-pre-splash-style">
      #varanda-pre-splash { position: fixed; inset: 0; z-index: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; margin: 0; background: #fbf8f3; pointer-events: none; animation: vps-expire 0s linear 20s forwards; }
      /* a no-script safety net so the overlay can never outlive a boot that failed to mount the app */
      @keyframes vps-expire { to { visibility: hidden; } }
      #varanda-pre-splash p { margin: 0; }
      #varanda-pre-splash .word { display: flex; font: 800 22px/26px ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: -0.2px; color: #1d6b4f; }
      #varanda-pre-splash .word span { display: inline-block; }
      #varanda-pre-splash .hint { margin-top: -4px; font: 14px/20px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #4a554e; }
      @media (prefers-reduced-motion: no-preference) {
        /* keep in sync with apps/app/src/ui/splashMotion.js */
        #varanda-pre-splash .chair { animation: vps-chair 700ms cubic-bezier(0.22, 1, 0.36, 1) both; }
        @keyframes vps-chair { from { opacity: 0; transform: translateY(16px) rotate(-6deg) scale(0.92); } to { opacity: 1; transform: none; } }
        #varanda-pre-splash .word span { animation: vps-rise 280ms ease-out both; animation-delay: calc(420ms + var(--i) * 40ms); }
        @keyframes vps-rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
        #varanda-pre-splash .hint { animation: vps-fade 320ms ease-out 860ms both, vps-pulse 1200ms ease-in-out 1180ms infinite alternate; }
        @keyframes vps-fade { from { opacity: 0; } to { opacity: 1; } }
        @keyframes vps-pulse { from { opacity: 1; } to { opacity: 0.6; } }
      }
    </style>
